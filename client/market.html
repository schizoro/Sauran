<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sauran Market</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="theme.css">
<style>
body{display:block;height:auto;min-height:100vh;margin:0;padding:20px;background:#0a0d11;color:#c5c6c7;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
.m-wrap{max-width:720px;margin:0 auto}
.m-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.m-head h1{font-size:19px;color:#5cc8ff;margin:0}
.m-head a{color:#c5c6c7;text-decoration:none;font-size:13px}
.m-sub{color:#6b7280;font-size:13px;margin:0 0 18px}
.m-wallet{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:999px;background:rgba(255,209,102,.12);border:1px solid rgba(255,209,102,.4);color:#ffd166;font-weight:bold;font-size:13px;margin-bottom:18px}
.m-section-title{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:#6b7280;margin:22px 0 10px}
.m-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.m-card{border-radius:18px;padding:14px;background:rgba(20,22,28,.55);backdrop-filter:blur(22px) saturate(180%);-webkit-backdrop-filter:blur(22px) saturate(180%);border:1px solid rgba(255,255,255,.08);display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.m-avatar-preview{width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center;font-size:20px;color:#8e9297;position:relative}
.m-name{font-size:13.5px;font-weight:650;color:#e2f8f6}
.m-rarity{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;padding:2px 8px;border-radius:999px}
.m-rarity-free{background:rgba(148,163,184,.15);color:#94a3b8}
.m-rarity-rare{background:rgba(79,195,232,.15);color:#4fc3e8}
.m-rarity-epic{background:rgba(255,47,208,.15);color:#ff2fd0}
.m-rarity-legendary{background:rgba(185,139,255,.15);color:#b98bff}
.m-rarity-special{background:rgba(255,213,74,.15);color:#ffd54a}
.m-price{font-size:12.5px;color:#8e9297}
.m-btn{width:100%;padding:8px;border-radius:999px;border:1px solid rgba(92,200,255,.45);background:rgba(92,200,255,.14);color:#5cc8ff;font-weight:bold;font-size:12.5px;cursor:pointer}
.m-btn:disabled{opacity:.45;cursor:default;border-color:rgba(255,255,255,.15);background:rgba(255,255,255,.04);color:#8e9297}
.m-btn.owned{border-color:rgba(126,231,135,.5);background:rgba(126,231,135,.12);color:#7ee787}
.m-state{color:#6b7280;font-size:13px;text-align:center;padding:40px 0}
.m-avatar-preview{overflow:visible}
.m-supporter-img{position:absolute;inset:-26%;width:152%;height:152%;object-fit:contain;pointer-events:none}
</style>
</head>
<body>
<div class="m-wrap">
  <div class="m-head"><h1>🛍️ Sauran Market</h1><a href="index.html">← Uygulamaya dön</a></div>
  <p class="m-sub">Profilini kişiselleştiren kozmetik ürünler.</p>
  <div id="m-state" class="m-state" style="display:none"></div>
  <div id="m-main" style="display:none">
    <div id="m-wallet" class="m-wallet">🪙 0 Coin</div>
    <div class="m-section-title">🖼️ Sahip Olduklarım</div>
    <div id="m-grid-owned" class="m-grid"></div>
    <div class="m-section-title">🔒 Henüz Alınmadı</div>
    <div id="m-grid-locked" class="m-grid"></div>
  </div>
</div>
<script>
(function(){
  const $=(i)=>document.getElementById(i);
  const esc=(s)=>String(s==null?'':s).replace(/[&<>"']/g,(c)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const api=async(u,m,b)=>{const r=await fetch(u,{method:m||'GET',headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined,credentials:'same-origin'});let d={};try{d=await r.json();}catch(_){}return{status:r.status,body:d};};
  const rarityLabel={free:'Ücretsiz',rare:'Rare',epic:'Epic',legendary:'Legendary',special:'Özel'};

  function previewHtml(item){
    if (item.key === 'supporter') {
      return `<img src="assets/frame-supporter.png" class="m-supporter-img" alt="${esc(item.label)}">`;
    }
    return esc(item.label.charAt(0));
  }

  function card(item){
    const previewClass = (item.key !== 'classic' && item.key !== 'supporter') ? ('frame-'+item.key) : '';
    const priceText = item.price === 0 ? 'Ücretsiz' : (item.price == null ? '—' : `${item.price} 🪙`);
    let btn;
    if (item.equipped) btn = `<button class="m-btn owned" disabled>✓ Kuşanılı</button>`;
    else if (item.owned) btn = `<button class="m-btn" data-equip="${esc(item.key)}">Kuşan</button>`;
    else btn = `<button class="m-btn" disabled>${item.purchasable ? 'Satın Al' : 'Satın Al — Yakında'}</button>`;
    return `<div class="m-card">
      <div class="m-avatar-preview profile-avatar-wrap ${previewClass}">${previewHtml(item)}</div>
      <div class="m-name">${esc(item.label)}</div>
      <span class="m-rarity m-rarity-${item.rarity}">${esc(rarityLabel[item.rarity] || item.rarity)}</span>
      <div class="m-price">${priceText}</div>
      ${btn}
    </div>`;
  }

  async function load(){
    const r = await api('/api/market/frames');
    if (r.status !== 200) { $('m-state').style.display='block'; $('m-state').textContent = r.status===401?'Giriş yapmalısın.':'Market yüklenemedi.'; return; }
    const w = await api('/api/wallet');
    if (w.status===200) $('m-wallet').textContent = `🪙 ${w.body.balance} Coin`;
    const classic = { key:'classic', label:'Klasik', rarity:'free', price:0, purchasable:false, owned:true, equipped: r.body.equipped==='classic' };
    const items = [classic, ...r.body.items];
    const owned = items.filter((i) => i.owned);
    const locked = items.filter((i) => !i.owned);
    $('m-grid-owned').innerHTML = owned.map(card).join('') || '<p class="m-state" style="padding:12px 0;">Henüz hiçbir şeye sahip değilsin.</p>';
    $('m-grid-locked').innerHTML = locked.length ? locked.map(card).join('') : '';
    document.querySelectorAll('.m-section-title')[1].style.display = locked.length ? '' : 'none';
    $('m-main').style.display = '';
  }

  document.addEventListener('click', async (e) => {
    const btn = e.target.closest('[data-equip]');
    if (!btn) return;
    btn.disabled = true; btn.textContent = 'Kuşanılıyor...';
    await api('/api/me/cosmetics/equip', 'POST', { item_key: btn.dataset.equip });
    load();
  });

  load();
})();
</script>
</body>
</html>
