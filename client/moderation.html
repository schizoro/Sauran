<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moderasyon Paneli — Sauran</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="theme.css">
    <style>
        body { margin: 0; padding: 24px; background: #0a0d11; color: #c5c6c7; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        .mod-wrap { max-width: 960px; margin: 0 auto; }
        .mod-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
        .mod-header h1 { font-size: 18px; color: #5cc8ff; margin: 0; letter-spacing: 1px; }
        .mod-state { text-align: center; padding: 60px 20px; color: #6b7280; font-size: 14px; }
        .mod-filters { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; }
        .mod-filters select {
            background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.12); color: #c5c6c7;
            border-radius: 8px; padding: 7px 10px; font-size: 12.5px;
        }
        .mod-list { display: flex; flex-direction: column; gap: 8px; }
        .mod-card {
            display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 12px; cursor: pointer;
            background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); transition: 0.15s;
        }
        .mod-card:hover { border-color: rgba(92,200,255,0.35); }
        .mod-priority { flex-shrink: 0; font-size: 10px; font-weight: bold; text-transform: uppercase; padding: 3px 8px; border-radius: 999px; }
        .mod-priority.critical { background: rgba(255,46,70,0.15); color: #ff6b7d; }
        .mod-priority.high { background: rgba(255,159,67,0.15); color: #ffb066; }
        .mod-priority.normal { background: rgba(255,255,255,0.06); color: #9ca3af; }
        .mod-card-main { flex: 1; min-width: 0; }
        .mod-card-title { font-size: 13px; color: #e2f8f6; margin-bottom: 2px; }
        .mod-card-meta { font-size: 11px; color: #6b7280; }
        .mod-status-badge { flex-shrink: 0; font-size: 10.5px; color: #5cc8ff; border: 1px solid rgba(92,200,255,0.3); border-radius: 999px; padding: 3px 9px; }
        .mod-modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: none; align-items: center; justify-content: center; z-index: 200; padding: 20px; }
        .mod-modal-overlay.open { display: flex; }
        .mod-modal {
            width: 100%; max-width: 520px; max-height: 86vh; overflow-y: auto; border-radius: 18px; padding: 24px;
            background: rgba(20,22,28,0.7); backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 20px 60px rgba(0,0,0,0.6);
        }
        .mod-modal h2 { margin: 0 0 14px; font-size: 15px; color: #5cc8ff; }
        .mod-field { margin-bottom: 12px; }
        .mod-field-label { font-size: 10.5px; text-transform: uppercase; letter-spacing: 1px; color: #6b7280; display: block; margin-bottom: 3px; }
        .mod-field-value { font-size: 13px; color: #c5c6c7; white-space: pre-wrap; word-break: break-word; }
        .mod-history { margin-top: 14px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,0.08); }
        .mod-history-row { font-size: 11.5px; color: #9ca3af; padding: 5px 0; }
        .mod-actions { display: flex; gap: 8px; margin-top: 18px; flex-wrap: wrap; }
        .mod-actions select, .mod-actions input {
            background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.12); color: #c5c6c7;
            border-radius: 8px; padding: 8px 10px; font-size: 12.5px; flex: 1; min-width: 120px;
        }
        .mod-actions button, #mod-view-account-btn {
            background: rgba(92,200,255,0.1); border: 1px solid rgba(92,200,255,0.4); color: #5cc8ff;
            border-radius: 8px; padding: 8px 16px; font-size: 12.5px; cursor: pointer; font-weight: bold;
        }
        .mod-close-btn { position: absolute; top: 16px; right: 16px; width: 26px; height: 26px; border-radius: 50%; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); color: #8e9297; cursor: pointer; }
        .mod-modal { position: relative; }
    </style>
</head>
<body>
    <div class="mod-wrap">

        <div class="mod-header">
            <h1>🛡️ SAURAN MODERASYON PANELİ</h1>
        </div>

        <div id="mod-loading" class="mod-state">Yükleniyor…</div>
        <div id="mod-denied" class="mod-state" style="display:none;">Bu sayfaya erişmek için gerekli platform yetkin yok.</div>

        <div id="mod-content" style="display:none;">

            <div class="mod-filters">
                <select id="mod-filter-status">
                    <option value="">Tüm durumlar</option>
                </select>
                <select id="mod-filter-priority">
                    <option value="">Tüm öncelikler</option>
                </select>
                <select id="mod-filter-reason">
                    <option value="">Tüm kategoriler</option>
                </select>
            </div>

            <div id="mod-list" class="mod-list"></div>
            <div id="mod-empty" class="mod-state" style="display:none;">Bu filtrelerle eşleşen rapor yok.</div>

        </div>

    </div>

    <div id="mod-detail-overlay" class="mod-modal-overlay">
        <div class="mod-modal">
            <button id="mod-detail-close" class="mod-close-btn">✕</button>
            <div id="mod-detail-body"></div>
        </div>
    </div>

    <script>
        let META = { reasons: [], statuses: [], priorities: [] };
        let currentReports = [];

        function esc(s) {
            return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        // Backend'e/DB'ye giden gerçek değerler İngilizce kod olarak kalıyor
        // (ör. "under_review") — burada sadece EKRANDA gösterilen etiketi
        // Türkçeleştiriyoruz.
        const STATUS_LABELS = { new: 'Yeni', under_review: 'İnceleniyor', action_taken: 'İşlem Yapıldı', dismissed: 'Reddedildi' };
        const PRIORITY_LABELS = { normal: 'Normal', high: 'Yüksek', critical: 'Kritik' };
        const REASON_LABELS = {
            harassment: 'Taciz', threat: 'Tehdit', spam: 'Spam', scam: 'Dolandırıcılık',
            inappropriate: 'Uygunsuz İçerik', child_safety: 'Çocuk Güvenliği', hate: 'Nefret / Ayrımcılık',
            impersonation: 'Sahte Hesap / Taklit', other: 'Diğer'
        };

        function statusLabel(s) { return STATUS_LABELS[s] || s; }
        function priorityLabel(p) { return PRIORITY_LABELS[p] || p; }
        function reasonLabel(r) { return REASON_LABELS[r] || r; }

        async function boot() {
            try {
                const metaRes = await fetch('/api/moderation/meta', { credentials: 'include' });

                if (metaRes.status === 401 || metaRes.status === 403) {
                    document.getElementById('mod-loading').style.display = 'none';
                    const denied = document.getElementById('mod-denied');
                    if (metaRes.status === 401) {
                        // Oturum bulunamadı (ör. e-posta uygulamasının kendi tarayıcısı ya da farklı alan adı): yetki değil, giriş eksik.
                        denied.textContent = 'Oturum bulunamadı. Bu sayfayı Sauran hesabına giriş yaptığın tarayıcıda aç ya da önce giriş yap. ';
                        const a = document.createElement('a');
                        a.href = '/index.html'; a.textContent = 'Giriş yap';
                        denied.appendChild(a);
                    }
                    denied.style.display = 'block';
                    return;
                }

                const metaData = await metaRes.json();
                if (!metaData.success) throw new Error('meta');
                META = metaData;

                populateFilters();
                document.getElementById('mod-loading').style.display = 'none';
                document.getElementById('mod-content').style.display = 'block';

                await loadReports();

            } catch (error) {
                console.error(error);
                document.getElementById('mod-loading').textContent = 'Bağlantı hatası. Sayfayı yenile.';
            }
        }

        function populateFilters() {
            const statusSel = document.getElementById('mod-filter-status');
            META.statuses.forEach(s => statusSel.innerHTML += `<option value="${s}">${esc(statusLabel(s))}</option>`);

            const prioSel = document.getElementById('mod-filter-priority');
            META.priorities.forEach(p => prioSel.innerHTML += `<option value="${p}">${esc(priorityLabel(p))}</option>`);

            const reasonSel = document.getElementById('mod-filter-reason');
            META.reasons.forEach(r => reasonSel.innerHTML += `<option value="${r}">${esc(reasonLabel(r))}</option>`);

            [statusSel, prioSel, reasonSel].forEach(el => el.addEventListener('change', loadReports));
        }

        async function loadReports() {
            const status = document.getElementById('mod-filter-status').value;
            const priority = document.getElementById('mod-filter-priority').value;
            const reason = document.getElementById('mod-filter-reason').value;

            const params = new URLSearchParams();
            if (status) params.set('status', status);
            if (priority) params.set('priority', priority);
            if (reason) params.set('reason', reason);

            const res = await fetch(`/api/moderation/reports?${params}`, { credentials: 'include' });
            const data = await res.json();
            if (!data.success) return;

            currentReports = data.reports;
            renderList();
        }

        function renderList() {
            const listEl = document.getElementById('mod-list');
            const emptyEl = document.getElementById('mod-empty');

            if (currentReports.length === 0) {
                listEl.innerHTML = '';
                emptyEl.style.display = 'block';
                return;
            }
            emptyEl.style.display = 'none';

            listEl.innerHTML = currentReports.map(r => `
                <div class="mod-card" data-id="${r.id}">
                    <span class="mod-priority ${esc(r.priority)}">${esc(priorityLabel(r.priority))}</span>
                    <div class="mod-card-main">
                        <div class="mod-card-title">#${r.id} — ${esc(reasonLabel(r.reason))} — ${esc(r.target_label)}</div>
                        <div class="mod-card-meta">Bildiren: ${esc(r.reporter_username || '(hesap silinmiş)')} · ${esc(r.created_at)}</div>
                    </div>
                    <span class="mod-status-badge">${esc(statusLabel(r.status))}</span>
                </div>
            `).join('');

            listEl.querySelectorAll('.mod-card').forEach(card => {
                card.addEventListener('click', () => openDetail(Number(card.dataset.id)));
            });
        }

        const MESSAGE_KIND_LABELS = {
            text: 'Metin', voice: 'Sesli Mesaj', image: 'Görsel', video: 'Video',
            file: 'Dosya', poll: 'Anket', share: 'Paylaşım', deleted: 'Silinmiş Mesaj'
        };

        const TARGET_TYPE_LABELS = {
            user: '👤 Kullanıcı Profili', hub: '🧩 Lobi', message: '💬 İleti', voice_room: '🎙️ Sesli Oda'
        };

        const PLATFORM_ROLE_LABELS = {
            user: 'Normal Kullanıcı', moderator: 'Moderatör', admin: 'Admin', founder: 'Kurucu'
        };

        function describeContext(report) {
            const ctx = report.target_context;
            if (!ctx || !ctx.exists) return 'Hedef bulunamadı (silinmiş olabilir).';

            if (report.target_type === 'user') return `Kullanıcı: ${esc(ctx.username)} (#${ctx.user_id})`;
            if (report.target_type === 'hub') return `Lobi: ${esc(ctx.hub_name)} — sahibi: ${esc(ctx.owner_username || 'bilinmiyor')}`;
            if (report.target_type === 'voice_room') return `Sesli Oda: ${esc(ctx.room_name)} — Lobi: ${esc(ctx.hub_name || 'bilinmiyor')}`;
            if (report.target_type === 'message') {
                const where = ctx.context?.type === 'hub' ? `Lobi: ${esc(ctx.context.hub_name || 'bilinmiyor')}` : 'Özel Mesaj (DM)';
                const kindLabel = MESSAGE_KIND_LABELS[ctx.kind] || ctx.kind;
                return `Gönderen: ${esc(ctx.sender_username)} — ${where}\nİleti Türü: ${esc(kindLabel)}`;
            }
            return `${esc(report.target_type)} #${report.target_id}`;
        }

        // Rapor edilen iletinin türüne göre gerçek içeriği (metin/ses/görsel/video/dosya/anket/paylaşım)
        // moderatöre gösterir — sadece metin mesajlarını değil, tüm ileti türlerini kapsar.
        function renderMessageContent(ctx) {
            if (!ctx || !ctx.exists) return '';
            const kind = ctx.kind;
            const payload = ctx.payload || {};

            if (kind === 'voice' && payload.audio) {
                return `<audio controls src="${esc(payload.audio)}" style="width:100%; margin-top:4px;"></audio>`;
            }
            if (kind === 'image' && payload.data) {
                return `<img src="${esc(payload.data)}" alt="${esc(payload.name || 'görsel')}" style="max-width:100%; max-height:320px; border-radius:8px; margin-top:4px; display:block;">`;
            }
            if (kind === 'video' && payload.data) {
                return `<video controls src="${esc(payload.data)}" style="max-width:100%; max-height:320px; border-radius:8px; margin-top:4px; display:block;"></video>`;
            }
            if (kind === 'file' && payload.data) {
                return `<a href="${esc(payload.data)}" download="${esc(payload.name || 'dosya')}" style="color:#5cc8ff;">📎 ${esc(payload.name || 'dosya')}</a> <span style="color:#6b7280;">(${Math.round((payload.size || 0) / 1024)} KB)</span>`;
            }
            if (kind === 'poll') {
                const options = Array.isArray(payload.options) ? payload.options : [];
                const optionsHtml = options.map(o => `<div>• ${esc(o.text ?? o)}${o.votes !== undefined ? ` — ${o.votes} oy` : ''}</div>`).join('');
                return `<div><strong>${esc(ctx.content || payload.question || '')}</strong></div>${optionsHtml}`;
            }
            if (kind === 'share') {
                return `${esc(ctx.content || '')}${payload.url ? `<br><a href="${esc(payload.url)}" target="_blank" rel="noopener noreferrer" style="color:#5cc8ff;">${esc(payload.url)}</a>` : ''}`;
            }
            if (kind === 'deleted') return '(bu mesaj kullanıcı tarafından silinmiş)';
            return esc(ctx.content || '(boş)');
        }

        // Mesaj raporlarında içerik, raporlandığı andaki kanıt kaydından gösterilir; mesaj sonradan silinse,
        // düzenlense ya da lobi temizlense bile kaybolmaz. Kanıt yoksa (eski rapor / süresi dolmuş) canlı mesaja düşülür.
        function renderMessageEvidence(r) {
            const ev = r.evidence || { state: 'none' };
            const badge = (text, color) => `<div style="margin:4px 6px 4px 0; padding:6px 10px; border-radius:8px; font-size:12px; background:${color}; color:#fff; display:inline-block;">${text}</div>`;
            const field = (label, html) => `<div class="mod-field"><span class="mod-field-label">${label}</span><span class="mod-field-value">${html}</span></div>`;

            if (ev.state === 'none') {
                return field('İleti İçeriği', `${badge('Kanıt kaydı bulunmuyor (rapor, kanıt özelliğinden önce açılmış)', '#6b7280')}<br>${renderMessageContent(r.target_context)}`);
            }
            if (ev.state === 'expired') {
                return field('İleti İçeriği', `${badge('Kanıt saklama süresi doldu, kanıt imha edildi', '#6b7280')}<br>${renderMessageContent(r.target_context)}`);
            }

            const notices = [];
            if (ev.message_state === 'deleted') notices.push(badge('⚠️ Mesaj daha sonra silindi', '#b45309'));
            else if (ev.message_state === 'edited') notices.push(badge('✏️ Mesaj raporlandıktan sonra düzenlendi — aşağıdaki, raporlandığı andaki içeriktir', '#4b5563'));
            else if (ev.message_state === 'hub_removed') notices.push(badge('⚠️ Lobi kaldırıldı', '#b45309'));
            else if (ev.message_state === 'chat_cleared') notices.push(badge('⚠️ Lobi sohbeti temizlendi', '#b45309'));
            else if (ev.message_state === 'removed') notices.push(badge('⚠️ Mesaj artık mevcut değil', '#b45309'));
            else notices.push(badge('Mesaj mevcut', '#047857'));
            if (ev.flags.sender_account_deleted) notices.push(badge('👤 Gönderen hesabı silindi', '#7c3aed'));
            if (ev.flags.recipient_account_deleted) notices.push(badge('👤 Alıcı hesabı silindi', '#7c3aed'));
            if (ev.flags.reporter_account_deleted) notices.push(badge('👤 Raporlayan hesabı silindi', '#7c3aed'));
            if (ev.media_state === 'purged') notices.push(badge('🗑️ Medya saklama süresi doldu, medya imha edildi', '#6b7280'));
            if (ev.media_state === 'too_large') notices.push(badge('Ek dosya çok büyük olduğu için kopyalanmadı', '#6b7280'));

            const ctx = { exists: true, kind: ev.kind, content: ev.content, payload: ev.payload };
            const where = ev.context.type === 'hub' ? `Lobi: ${esc(ev.context.hub_name || 'bilinmiyor')}` : 'Özel Mesaj (DM)';

            return field('İleti İçeriği (raporlandığı an)', `${notices.join('')}<br>${renderMessageContent(ctx)}`) +
                field('Kanıt Bilgisi', `Mesaj #${ev.message_id} · Gönderen: ${ev.sender_username ? esc(ev.sender_username) : '<em>(hesap silinmiş)</em>'} · ${where}<br>Mesaj tarihi: ${esc(ev.message_created_at || '—')} · Kanıt alındı: ${esc(ev.captured_at)}<br>Kanıt saklama sonu: ${esc(ev.retention_until)}${ev.media_retention_until ? ' · Medya saklama sonu: ' + esc(ev.media_retention_until) : ''} · Rapor kaydı saklama sonu: ${esc(ev.report_retention_until)}`);
        }

        // Kullanıcı profili raporlarında moderatörün hesabı doğrudan bu panelden
        // inceleyebilmesi için — ayrı bir sayfaya gitmesine gerek kalmıyor.
        async function loadAccountDetail(userId) {
            const box = document.getElementById('mod-account-box');
            box.innerHTML = '<div class="mod-field-value">Yükleniyor...</div>';

            try {
                const res = await fetch(`/api/moderation/users/${userId}`, { credentials: 'include' });
                const data = await res.json();

                if (!data.success) {
                    box.innerHTML = `<div class="mod-field-value">Hesap bulunamadı (silinmiş olabilir).</div>`;
                    return;
                }

                const u = data.user;
                const avatarHtml = u.avatar_data
                    ? `<img src="${esc(u.avatar_data)}" alt="" style="width:48px; height:48px; border-radius:50%; object-fit:cover;">`
                    : `<div style="width:48px; height:48px; border-radius:50%; background:rgba(92,200,255,0.12); display:flex; align-items:center; justify-content:center; font-weight:bold; color:#5cc8ff;">${esc((u.username || '?')[0].toUpperCase())}</div>`;

                box.innerHTML = `
                    <div style="display:flex; align-items:center; gap:12px; margin:10px 0;">
                        ${avatarHtml}
                        <div>
                            <div style="font-size:14px; font-weight:bold; color:#e2f8f6;">${esc(u.username)} (#${u.id})</div>
                            <div style="font-size:11.5px; color:#6b7280;">${esc(PLATFORM_ROLE_LABELS[u.platform_role] || u.platform_role)}</div>
                        </div>
                    </div>
                    <div class="mod-field"><span class="mod-field-label">E-posta</span><span class="mod-field-value">${esc(u.email || '—')}</span></div>
                    <div class="mod-field"><span class="mod-field-label">Kayıt Tarihi</span><span class="mod-field-value">${esc(u.created_at)}</span></div>
                    <div class="mod-field"><span class="mod-field-label">Yaş Grubu</span><span class="mod-field-value">${u.age_group === 'minor' ? '18 yaş altı' : '18 yaş ve üzeri'}</span></div>
                    <div class="mod-field"><span class="mod-field-label">Hakkımda</span><span class="mod-field-value">${esc(u.about_me || '—')}</span></div>
                    <div class="mod-field">
                        <span class="mod-field-label">İstatistikler</span>
                        <span class="mod-field-value">
                            Bu kullanıcı hakkında ${u.stats.reportsAgainst} rapor var · Kendisi ${u.stats.reportsFiled} rapor açmış<br>
                            ${u.stats.hubsOwned} Lobi sahibi · ${u.stats.hubsMember} Lobi üyesi · ${u.stats.messageCount} ileti göndermiş
                        </span>
                    </div>
                `;

            } catch (error) {
                console.error(error);
                box.innerHTML = `<div class="mod-field-value">Hesap bilgisi alınamadı.</div>`;
            }
        }

        async function openDetail(id) {
            const res = await fetch(`/api/moderation/reports/${id}`, { credentials: 'include' });
            const data = await res.json();
            if (!data.success) return;

            const r = data.report;

            const historyHtml = r.history.length
                ? r.history.map(h => `<div class="mod-history-row">${esc(h.created_at)} — ${esc(h.moderator_username || 'CLI')} → <strong>${esc(statusLabel(h.action))}</strong>${h.reason ? ' (' + esc(h.reason) + ')' : ''}</div>`).join('')
                : '<div class="mod-history-row">Henüz işlem yok.</div>';

            document.getElementById('mod-detail-body').innerHTML = `
                <h2>Rapor #${r.id}</h2>
                <div class="mod-field"><span class="mod-field-label">Rapor Türü</span><span class="mod-field-value">${esc(TARGET_TYPE_LABELS[r.target_type] || r.target_type)}</span></div>
                <div class="mod-field"><span class="mod-field-label">Kategori</span><span class="mod-field-value">${esc(reasonLabel(r.reason))} · ${esc(priorityLabel(r.priority))}</span></div>
                <div class="mod-field"><span class="mod-field-label">Bildiren</span><span class="mod-field-value">${r.reporter_username ? esc(r.reporter_username) : '<em>Raporlayan hesabı silinmiş</em>'}</span></div>
                <div class="mod-field"><span class="mod-field-label">Bağlam</span><span class="mod-field-value">${describeContext(r)}</span></div>
                ${r.target_type === 'message' ? renderMessageEvidence(r) : ''}
                <div class="mod-field"><span class="mod-field-label">Açıklama</span><span class="mod-field-value">${esc(r.description || '—')}</span></div>
                <div class="mod-field"><span class="mod-field-label">Tarih</span><span class="mod-field-value">${esc(r.created_at)}</span></div>
                <div class="mod-field"><span class="mod-field-label">Durum</span><span class="mod-field-value">${esc(statusLabel(r.status))}</span></div>

                ${r.target_type === 'user' && r.target_context?.exists ? `
                <div class="mod-field">
                    <button id="mod-view-account-btn" type="button" data-user-id="${r.target_context.user_id}">🔍 Hesap Detaylarını Görüntüle</button>
                </div>
                <div id="mod-account-box"></div>
                ` : ''}

                <div class="mod-history">
                    <span class="mod-field-label">Moderasyon Geçmişi</span>
                    ${historyHtml}
                </div>

                <div class="mod-actions">
                    <select id="mod-action-status">
                        ${META.statuses.map(s => `<option value="${s}" ${s === r.status ? 'selected' : ''}>${esc(statusLabel(s))}</option>`).join('')}
                    </select>
                    <input id="mod-action-reason" type="text" placeholder="Not (opsiyonel)" maxlength="300">
                    <button id="mod-action-submit" type="button">Güncelle</button>
                </div>
            `;

            const viewAccountBtn = document.getElementById('mod-view-account-btn');
            if (viewAccountBtn) {
                viewAccountBtn.addEventListener('click', () => loadAccountDetail(Number(viewAccountBtn.dataset.userId)));
            }

            document.getElementById('mod-action-submit').addEventListener('click', async () => {
                const status = document.getElementById('mod-action-status').value;
                const reason = document.getElementById('mod-action-reason').value;

                const updateRes = await fetch(`/api/moderation/reports/${id}`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ status, reason })
                });
                const updateData = await updateRes.json();

                if (updateData.success) {
                    closeDetail();
                    loadReports();
                } else {
                    alert(updateData.error || 'Güncellenemedi.');
                }
            });

            document.getElementById('mod-detail-overlay').classList.add('open');
        }

        function closeDetail() {
            document.getElementById('mod-detail-overlay').classList.remove('open');
        }

        document.getElementById('mod-detail-close').addEventListener('click', closeDetail);
        document.getElementById('mod-detail-overlay').addEventListener('click', (e) => {
            if (e.target.id === 'mod-detail-overlay') closeDetail();
        });

        boot();
    </script>
</body>
</html>
