<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yönetim Paneli — Sauran</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { display: block; height: auto; min-height: 100vh; margin: 0; padding: 20px; background: #0b0c10; color: #c5c6c7; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        .adm-wrap { max-width: 1100px; margin: 0 auto; }
        .adm-header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; margin-bottom: 20px; }
        .adm-header h1 { font-size: 18px; color: #66fcf1; margin: 0; letter-spacing: 1px; }
        .adm-nav { display: flex; gap: 8px; flex-wrap: wrap; }
        .adm-nav a, .adm-nav button {
            padding: 8px 16px; border-radius: 999px; font-size: 12.5px; font-weight: bold; cursor: pointer; text-decoration: none;
            color: #c5c6c7; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.12); transition: 0.15s;
        }
        .adm-nav a:hover, .adm-nav button:hover, .adm-nav button.active { color: #66fcf1; border-color: rgba(102,252,241,0.4); }
        .adm-state { text-align: center; padding: 60px 20px; color: #6b7280; font-size: 14px; }
        .adm-glass {
            border-radius: 18px; padding: 18px; background: rgba(20,22,28,0.55);
            backdrop-filter: blur(22px) saturate(180%); -webkit-backdrop-filter: blur(22px) saturate(180%);
            border: 1px solid rgba(255,255,255,0.08); box-shadow: 0 8px 40px rgba(0,0,0,0.35);
        }
        .adm-stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; margin-bottom: 22px; }
        .adm-stat { padding: 14px 16px; }
        .adm-stat-value { font-size: 24px; font-weight: bold; color: #e2f8f6; }
        .adm-stat-label { font-size: 11px; color: #6b7280; text-transform: uppercase; letter-spacing: 0.8px; margin-top: 2px; }
        .adm-toolbar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
        .adm-toolbar input, .adm-toolbar select {
            background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.12); color: #c5c6c7;
            border-radius: 10px; padding: 9px 12px; font-size: 13px; outline: none;
        }
        .adm-toolbar input { flex: 1; min-width: 180px; }
        .adm-toolbar input:focus { border-color: rgba(102,252,241,0.45); }
        table.adm-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .adm-table th { text-align: left; font-size: 10.5px; text-transform: uppercase; letter-spacing: 1px; color: #6b7280; padding: 8px 10px; }
        .adm-table td { padding: 10px; border-top: 1px solid rgba(255,255,255,0.06); overflow-wrap: anywhere; }
        .adm-table tbody tr { cursor: pointer; transition: 0.12s; }
        .adm-table tbody tr:hover { background: rgba(102,252,241,0.06); }
        .adm-role { font-size: 10.5px; font-weight: bold; text-transform: uppercase; padding: 3px 9px; border-radius: 999px; background: rgba(255,255,255,0.06); color: #9ca3af; }
        .adm-role.moderator { background: rgba(102,252,241,0.12); color: #66fcf1; }
        .adm-role.admin { background: rgba(255,159,67,0.15); color: #ffb066; }
        .adm-role.founder { background: rgba(255,46,70,0.15); color: #ff6b7d; }
        .adm-pager { display: flex; align-items: center; justify-content: space-between; margin-top: 14px; font-size: 12.5px; color: #6b7280; gap: 10px; flex-wrap: wrap; }
        .adm-pager button { padding: 7px 16px; border-radius: 999px; cursor: pointer; color: #66fcf1; background: rgba(102,252,241,0.08); border: 1px solid rgba(102,252,241,0.35); font-weight: bold; }
        .adm-pager button:disabled { opacity: 0.35; cursor: not-allowed; }
        .adm-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.55); display: none; justify-content: flex-end; z-index: 200; }
        .adm-overlay.open { display: flex; }
        .adm-panel {
            position: relative; width: 420px; max-width: 100vw; height: 100%; overflow-y: auto; padding: 24px 22px;
            background: rgba(20,22,28,0.7); backdrop-filter: blur(22px) saturate(180%); -webkit-backdrop-filter: blur(22px) saturate(180%);
            border-left: 1px solid rgba(255,255,255,0.1); box-shadow: -14px 0 40px rgba(0,0,0,0.45); animation: dm-panel-in 0.22s ease-out;
        }
        .adm-close { position: absolute; top: 16px; right: 16px; width: 28px; height: 28px; border-radius: 50%; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); color: #8e9297; cursor: pointer; }
        .adm-user-head { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; padding-right: 30px; }
        .adm-avatar { width: 56px; height: 56px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; font-size: 22px; font-weight: bold; color: #66fcf1; background: rgba(255,255,255,0.06); }
        .adm-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .adm-section-title { font-size: 10.5px; text-transform: uppercase; letter-spacing: 1px; color: #66fcf1; margin: 18px 0 8px; }
        .adm-row { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 13px; }
        .adm-row span:first-child { color: #6b7280; }
        .adm-row span:last-child { color: #e2f8f6; text-align: right; word-break: break-word; }
        .adm-muted { color: #6b7280 !important; font-style: italic; }
        .adm-about { font-size: 13px; color: #c5c6c7; white-space: pre-wrap; word-break: break-word; }
        .adm-apply-btn { padding: 9px 16px; border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 12.5px; color: #66fcf1; background: rgba(102,252,241,0.1); border: 1px solid rgba(102,252,241,0.4); }
        .adm-apply-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .adm-mod-link { display: inline-block; margin-top: 14px; font-size: 12.5px; color: #66fcf1; }
        @media (max-width: 720px) {
            body { padding: 14px; }
            table.adm-table thead { display: none; }
            table.adm-table, .adm-table tbody, .adm-table tr, .adm-table td { display: block; width: 100%; }
            .adm-table tr { border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; background: rgba(255,255,255,0.03); }
            .adm-table td { border: none; padding: 3px 0; display: flex; justify-content: space-between; gap: 10px; }
            .adm-table td::before { content: attr(data-label); color: #6b7280; font-size: 11px; text-transform: uppercase; }
        }
    </style>
</head>
<body>
    <div class="adm-wrap">

        <div class="adm-header">
            <h1 id="t-title">🛡️ SAURAN YÖNETİM PANELİ</h1>
            <div class="adm-nav">
                <button type="button" id="tab-users" class="active">Kullanıcılar</button>
                <button type="button" id="tab-audit" style="display:none;">Audit Log</button>
                <a href="/" id="t-back">← Uygulama</a>
                <a href="moderation.html" id="t-moderation">Moderasyon Paneli</a>
            </div>
        </div>

        <div id="adm-loading" class="adm-state"></div>
        <div id="adm-denied" class="adm-state" style="display:none;"></div>

        <div id="adm-content" style="display:none;">

          <div id="adm-users-view">

            <div id="adm-stats" class="adm-stats"></div>

            <div class="adm-glass">
                <div class="adm-toolbar">
                    <input type="text" id="adm-search" autocomplete="off">
                    <select id="adm-role-filter"></select>
                </div>
                <div id="adm-table-wrap"></div>
                <div id="adm-empty" class="adm-state" style="display:none;"></div>
                <div class="adm-pager">
                    <span id="adm-page-info"></span>
                    <div>
                        <button id="adm-prev" type="button"></button>
                        <button id="adm-next" type="button"></button>
                    </div>
                </div>
            </div>

          </div>

          <div id="adm-audit-view" style="display:none;">
            <div class="adm-glass">
                <div class="adm-toolbar">
                    <select id="au-action"></select>
                    <input type="text" id="au-actor" inputmode="numeric" style="flex:0 1 120px;min-width:100px;">
                    <input type="text" id="au-target" inputmode="numeric" style="flex:0 1 120px;min-width:100px;">
                    <input type="date" id="au-from">
                    <input type="date" id="au-to">
                </div>
                <div id="au-table-wrap"></div>
                <div id="au-empty" class="adm-state" style="display:none;"></div>
                <div class="adm-pager">
                    <span id="au-page-info"></span>
                    <div>
                        <button id="au-prev" type="button"></button>
                        <button id="au-next" type="button"></button>
                    </div>
                </div>
                <p id="au-note" class="adm-muted" style="font-size:11px;margin:12px 0 0;"></p>
            </div>
          </div>

        </div>
    </div>

    <div id="adm-overlay" class="adm-overlay">
        <div class="adm-panel">
            <button id="adm-close" class="adm-close" type="button">✕</button>
            <div id="adm-detail"></div>
        </div>
    </div>

    <script>
        const I18N = {
            tr: {
                title: '🛡️ SAURAN YÖNETİM PANELİ', back: '← Uygulama', moderation: 'Moderasyon Paneli',

                search: 'Kullanıcı adı, e-posta veya ID ara…', allRoles: 'Tüm roller',
                total_users: 'Toplam kullanıcı', online_now: 'Şu an çevrimiçi', users_registered_today: 'Bugünkü kayıtlar',
                total_hubs: 'Toplam Lobi', total_messages: 'Toplam mesaj', total_reports: 'Toplam rapor', open_reports: 'Bekleyen rapor',
                id: 'ID', username: 'Kullanıcı adı', role: 'Rol', created: 'Kayıt', hubs: 'Lobi', friends: 'Arkadaş', messages: 'Mesaj', reports: 'Rapor',
                empty: 'Eşleşen kullanıcı yok.', prev: 'Önceki', next: 'Sonraki', page: 'Sayfa', of: '/', users: 'kullanıcı',
                account: 'Hesap', email: 'E-posta', noEmail: 'kayıtlı değil', profile: 'Profil', about: 'Hakkında', noAbout: 'yazılmamış',
                avatarVisibility: 'Avatar görünürlüğü', activity: 'Aktivite', lastActivity: 'Son aktivite', notTracked: 'sistemde tutulmuyor',
                hubMessages: 'Lobi mesajı', dmSent: 'Gönderilen DM', hubsOwned: 'Sahibi olduğu Lobi', hubsMember: 'Üye olduğu Lobi',
                moderationSec: 'Moderasyon', reportsAgainst: 'Hakkındaki rapor', reportsOpen: 'Açık', reportsResolved: 'Çözümlenen', reportsFiled: 'Açtığı rapor',
                viewReports: 'Moderasyon panelinde incele →', readOnly: 'Bu panelden kullanıcı silinemez ve kullanıcı verisi dışa aktarılamaz.',
                roleTitle: 'Platform rolü', roleNew: 'Yeni rol', roleReasonPh: 'Gerekçe (zorunlu)', roleApply: 'Rolü Değiştir',
                roleFounderLocked: 'Founder rolü web panelinden değiştirilemez.', roleDone: 'Rol güncellendi.', rolePending: 'Kullanıcı yeni yönetim görevi için kabul bekliyor.',
                roleHint: 'Bu gerekçe yalnızca iç yönetim kaydına (audit log) yazılır, kullanıcıya gösterilmez.',
                roleReasonRequired: 'Gerekçe zorunlu.', roleWorking: 'Uygulanıyor…',
                accStatus: 'Hesap durumu', statusActive: 'Aktif', statusSuspended: 'Askıda', suspendedBadge: 'Askıda',
                suspendTitle: 'Hesap askısı', suspendBtn: 'Hesabı Askıya Al', unsuspendBtn: 'Askıyı Kaldır',
                internalReasonPh: 'İç gerekçe (zorunlu, kullanıcıya gösterilmez)', userReasonPh: 'Kullanıcıya gösterilecek gerekçe (isteğe bağlı)',
                internalHint: 'İç gerekçe yalnızca yönetim kaydına (audit log) yazılır, kullanıcıya gösterilmez.',
                userReasonWarn: 'Kullanıcıya gösterilebilecek kısa ve uygun bir gerekçe yazın. Başka kullanıcıların kişisel bilgilerini eklemeyin.',
                internalReasonRequired: 'İç gerekçe zorunlu.', confirmSuspend: 'Bu hesap askıya alınsın mı? Kullanıcı oturumu kapatılır ve giriş yapamaz.',
                suspendDone: 'Hesap askıya alındı.', unsuspendDone: 'Askı kaldırıldı.', suspendedSince: 'Askıya alındı:',
                userSeesReason: 'Kullanıcının gördüğü gerekçe', noneGiven: 'belirtilmedi',
                tabUsers: 'Kullanıcılar', tabAudit: 'Audit Log',
                auDate: 'Tarih', auActor: 'Yapan', auAction: 'İşlem', auTarget: 'Hedef', auReason: 'Gerekçe', auChange: 'Değişiklik',
                auAllActions: 'Tüm işlemler', auActorPh: 'Yapan ID', auTargetPh: 'Hedef ID', auFrom: 'Başlangıç', auTo: 'Bitiş',
                auEmpty: 'Kayıt bulunamadı.', auEntries: 'kayıt', auDeleted: 'silinmiş hesap',
                auNote: 'Yönetim geçmişi yalnızca ekleme yapılarak tutulur; bu panelden değiştirilemez veya silinemez. Yalnızca yönetimsel değişiklikler kaydedilir, sayfa görüntülemeleri kaydedilmez.',
                act_platform_role_changed: 'Rol değişikliği', act_platform_role_accepted: 'Görev kabulü', act_account_suspended: 'Hesap askıya alındı', act_account_unsuspended: 'Askı kaldırıldı'
            },
            en: {
                title: '🛡️ SAURAN ADMIN PANEL', back: '← App', moderation: 'Moderation Panel',
                loading: 'Loading…', denied: 'You do not have access to this page.', error: 'Something went wrong.',
                search: 'Search username, email or ID…', allRoles: 'All roles',
                total_users: 'Total users', online_now: 'Online now', users_registered_today: 'Registered today',
                total_hubs: 'Total lobbies', total_messages: 'Total messages', total_reports: 'Total reports', open_reports: 'Pending reports',
                id: 'ID', username: 'Username', role: 'Role', created: 'Joined', hubs: 'Lobbies', friends: 'Friends', messages: 'Messages', reports: 'Reports',
                empty: 'No matching users.', prev: 'Previous', next: 'Next', page: 'Page', of: '/', users: 'users',
                account: 'Account', email: 'Email', noEmail: 'not on file', profile: 'Profile', about: 'About', noAbout: 'not written',
                avatarVisibility: 'Avatar visibility', activity: 'Activity', lastActivity: 'Last activity', notTracked: 'not tracked by the system',
                hubMessages: 'Lobby messages', dmSent: 'DMs sent', hubsOwned: 'Lobbies owned', hubsMember: 'Lobbies joined',
                moderationSec: 'Moderation', reportsAgainst: 'Reports against', reportsOpen: 'Open', reportsResolved: 'Resolved', reportsFiled: 'Reports filed',
                viewReports: 'Review in moderation panel →', readOnly: 'Users cannot be deleted and user data cannot be exported from this panel.',
                roleTitle: 'Platform role', roleNew: 'New role', roleReasonPh: 'Reason (required)', roleApply: 'Change Role',
                roleFounderLocked: 'The founder role cannot be changed from the web panel.', roleDone: 'Role updated.', rolePending: 'The user is awaiting acceptance of the new management duty.',
                roleHint: 'This reason is written only to the internal admin record (audit log) and is not shown to the user.',
                roleReasonRequired: 'A reason is required.', roleWorking: 'Applying…',
                accStatus: 'Account status', statusActive: 'Active', statusSuspended: 'Suspended', suspendedBadge: 'Suspended',
                suspendTitle: 'Account suspension', suspendBtn: 'Suspend Account', unsuspendBtn: 'Lift Suspension',
                internalReasonPh: 'Internal reason (required, not shown to the user)', userReasonPh: 'Reason shown to the user (optional)',
                internalHint: 'The internal reason is written only to the admin record (audit log) and is not shown to the user.',
                userReasonWarn: 'Write a short, appropriate reason the user may see. Do not include other users\' personal information.',
                internalReasonRequired: 'An internal reason is required.', confirmSuspend: 'Suspend this account? The user will be signed out and unable to log in.',
                suspendDone: 'Account suspended.', unsuspendDone: 'Suspension lifted.', suspendedSince: 'Suspended:',
                userSeesReason: 'Reason shown to the user', noneGiven: 'not given',
                tabUsers: 'Users', tabAudit: 'Audit Log',
                auDate: 'Date', auActor: 'By', auAction: 'Action', auTarget: 'Target', auReason: 'Reason', auChange: 'Change',
                auAllActions: 'All actions', auActorPh: 'Actor ID', auTargetPh: 'Target ID', auFrom: 'From', auTo: 'To',
                auEmpty: 'No entries found.', auEntries: 'entries', auDeleted: 'deleted account',
                auNote: 'The admin history is append-only; it cannot be changed or deleted from this panel. Only administrative changes are recorded, not page views.',
                act_platform_role_changed: 'Role changed', act_platform_role_accepted: 'Duty accepted', act_account_suspended: 'Account suspended', act_account_unsuspended: 'Suspension lifted'
            }
        };

        let lang = 'tr';
        try { lang = localStorage.getItem('sauran_lang') === 'en' ? 'en' : 'tr'; } catch (e) {}
        const t = (k) => I18N[lang][k] ?? k;
        document.documentElement.lang = lang;

        function esc(s) {
            return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }
        function fmtDate(d) {
            if (!d) return '—';
            const dt = new Date(String(d).replace(' ', 'T') + 'Z');
            return isNaN(dt) ? esc(d) : dt.toLocaleString(lang === 'en' ? 'en-GB' : 'tr-TR', { dateStyle: 'medium', timeStyle: 'short' });
        }
        function safeImg(src) {
            return typeof src === 'string' && /^data:image\/(png|jpe?g|webp|gif);base64,/.test(src) ? src : null;
        }

        const state = { page: 1, limit: 20, search: '', role: '', total: 0 };
        const $ = (id) => document.getElementById(id);

        async function api(path) {
            const res = await fetch(path, { credentials: 'include' });
            if (res.status === 401 || res.status === 403) throw Object.assign(new Error('denied'), { denied: true });
            const data = await res.json();
            if (!data.success) throw new Error(data.error || 'error');
            return data;
        }

        async function send(method, path, body) {
            const res = await fetch(path, { method, credentials: 'include', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
            const data = await res.json().catch(() => ({}));
            if (!res.ok || !data.success) throw Object.assign(new Error(data.error || 'error'), { status: res.status });
            return data;
        }

        function statusBadge(a) {
            return a.account_status === 'suspended'
                ? `<span class="adm-role founder">${esc(t('statusSuspended'))}</span>`
                : `<span class="adm-role">${esc(t('statusActive'))}</span>`;
        }

        function suspendControlsHtml(a) {
            if (!isFounder || a.platform_role === 'founder') return '';
            const area = 'background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.12);color:#c5c6c7;border-radius:10px;padding:9px 12px;font-size:13px;font-family:inherit;outline:none;';
            if (a.account_status === 'suspended') {
                return `
                    <div class="adm-section-title">${t('suspendTitle')}</div>
                    <p class="adm-muted" style="font-size:12px;margin:0 0 4px;">${esc(t('suspendedSince'))} ${fmtDate(a.suspended_at)}</p>
                    <p class="adm-muted" style="font-size:12px;margin:0 0 8px;">${esc(t('userSeesReason'))}: ${a.user_reason ? esc(a.user_reason) : esc(t('noneGiven'))}</p>
                    <div class="adm-toolbar" style="flex-direction:column;gap:8px;margin-bottom:6px;">
                        <textarea id="sc-internal" maxlength="500" rows="2" placeholder="${esc(t('internalReasonPh'))}" style="${area}resize:vertical;"></textarea>
                        <button id="sc-apply" type="button" class="adm-apply-btn">${esc(t('unsuspendBtn'))}</button>
                    </div>
                    <div id="sc-msg" style="font-size:12px;min-height:16px;" role="status"></div>`;
            }
            return `
                <div class="adm-section-title">${t('suspendTitle')}</div>
                <div class="adm-toolbar" style="flex-direction:column;gap:8px;margin-bottom:6px;">
                    <textarea id="sc-internal" maxlength="500" rows="2" placeholder="${esc(t('internalReasonPh'))}" style="${area}resize:vertical;"></textarea>
                    <input type="text" id="sc-user" maxlength="300" placeholder="${esc(t('userReasonPh'))}" style="${area}">
                    <button id="sc-apply" type="button" class="adm-apply-btn" style="color:#ff6b7d;border-color:rgba(255,46,70,0.45);background:rgba(255,46,70,0.08);">${esc(t('suspendBtn'))}</button>
                </div>
                <p class="adm-muted" style="font-size:11px;margin:0 0 4px;">${esc(t('internalHint'))}</p>
                <p class="adm-muted" style="font-size:11px;margin:0 0 4px;">${esc(t('userReasonWarn'))}</p>
                <div id="sc-msg" style="font-size:12px;min-height:16px;" role="status"></div>`;
        }

        function wireSuspendControls(a) {
            const btn = $('sc-apply');
            if (!btn) return;
            const suspended = a.account_status === 'suspended';
            btn.addEventListener('click', async () => {
                const msg = $('sc-msg');
                const internal = $('sc-internal').value.trim();
                if (!internal) { msg.style.color = '#ff6b7d'; msg.textContent = t('internalReasonRequired'); return; }
                if (!suspended && !confirm(t('confirmSuspend'))) return;
                btn.disabled = true;
                msg.style.color = '#9ca3af';
                msg.textContent = t('roleWorking');
                try {
                    const path = `/api/admin/users/${encodeURIComponent(a.id)}/${suspended ? 'unsuspend' : 'suspend'}`;
                    const body = suspended ? { internal_reason: internal } : { internal_reason: internal, user_reason: $('sc-user').value.trim() };
                    await send('PATCH', path, body);
                    await openDetail(a.id);
                    $('sc-msg').style.color = '#57f287';
                    $('sc-msg').textContent = t(suspended ? 'unsuspendDone' : 'suspendDone');
                    loadUsers().catch(() => {});
                    if (audit.loaded) loadAudit().catch(() => {});
                } catch (e) {
                    msg.style.color = '#ff6b7d';
                    msg.textContent = e.message;
                    btn.disabled = false;
                }
            });
        }

        function roleControlsHtml(a) {
            if (!isFounder) return '';
            if (a.platform_role === 'founder') {
                return `<div class="adm-section-title">${t('roleTitle')}</div><p class="adm-muted" style="font-size:12px;margin:0;">${esc(t('roleFounderLocked'))}</p>`;
            }
            const opts = ['user', 'moderator', 'admin'].map((r) => `<option value="${r}" ${r === a.platform_role ? 'selected' : ''}>${r}</option>`).join('');
            return `
                <div class="adm-section-title">${t('roleTitle')}</div>
                <div class="adm-toolbar" style="flex-direction:column;gap:8px;margin-bottom:6px;">
                    <select id="rc-role" aria-label="${esc(t('roleNew'))}">${opts}</select>
                    <textarea id="rc-reason" maxlength="500" rows="2" placeholder="${esc(t('roleReasonPh'))}"
                        style="background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.12);color:#c5c6c7;border-radius:10px;padding:9px 12px;font-size:13px;font-family:inherit;resize:vertical;outline:none;"></textarea>
                    <button id="rc-apply" type="button" class="adm-apply-btn">${esc(t('roleApply'))}</button>
                </div>
                <p class="adm-muted" style="font-size:11px;margin:0 0 4px;">${esc(t('roleHint'))}</p>
                <div id="rc-msg" style="font-size:12px;min-height:16px;" role="status"></div>`;
        }

        function wireRoleControls(a) {
            const btn = $('rc-apply');
            if (!btn) return;
            btn.addEventListener('click', async () => {
                const msg = $('rc-msg');
                const reason = $('rc-reason').value.trim();
                if (!reason) { msg.style.color = '#ff6b7d'; msg.textContent = t('roleReasonRequired'); return; }
                btn.disabled = true;
                msg.style.color = '#9ca3af';
                msg.textContent = t('roleWorking');
                try {
                    const changed = await send('PATCH', `/api/admin/users/${encodeURIComponent(a.id)}/role`, { role: $('rc-role').value, reason });
                    await openDetail(a.id);
                    $('rc-msg').style.color = '#57f287';
                    $('rc-msg').textContent = t('roleDone') + (changed.user && changed.user.role_acceptance_pending ? ' ' + t('rolePending') : '');
                    loadUsers().catch(() => {});
                    if (audit.loaded) loadAudit().catch(() => {});
                } catch (e) {
                    msg.style.color = '#ff6b7d';
                    msg.textContent = e.message;
                    btn.disabled = false;
                }
            });
        }

        function applyStaticText() {
            $('t-title').textContent = t('title');
            $('t-back').textContent = t('back');
            $('t-moderation').textContent = t('moderation');
            $('adm-search').placeholder = t('search');
            $('adm-prev').textContent = t('prev');
            $('adm-next').textContent = t('next');
            $('adm-empty').textContent = t('empty');
            $('adm-loading').textContent = t('loading');
            $('adm-denied').textContent = t('denied');
            $('tab-users').textContent = t('tabUsers');
            $('tab-audit').textContent = t('tabAudit');
            $('au-actor').placeholder = t('auActorPh');
            $('au-target').placeholder = t('auTargetPh');
            $('au-from').title = t('auFrom');
            $('au-to').title = t('auTo');
            $('au-empty').textContent = t('auEmpty');
            $('au-prev').textContent = t('prev');
            $('au-next').textContent = t('next');
            $('au-note').textContent = t('auNote');
            $('au-action').innerHTML = `<option value="">${esc(t('auAllActions'))}</option>` +
                AUDIT_ACTIONS.map((a) => `<option value="${a}">${esc(t('act_' + a))}</option>`).join('');
            const sel = $('adm-role-filter');
            sel.innerHTML = `<option value="">${esc(t('allRoles'))}</option>` +
                ['user', 'moderator', 'admin', 'founder'].map((r) => `<option value="${r}">${r}</option>`).join('');
        }

        async function loadStats() {
            const { stats } = await api('/api/admin/stats');
            const keys = ['total_users', 'online_now', 'users_registered_today', 'total_hubs', 'total_messages', 'total_reports', 'open_reports'];
            $('adm-stats').innerHTML = keys.map((k) => `
                <div class="adm-glass adm-stat"><div class="adm-stat-value">${esc(stats[k])}</div><div class="adm-stat-label">${esc(t(k))}</div></div>
            `).join('');
        }

        async function loadUsers() {
            const params = new URLSearchParams({ page: state.page, limit: state.limit });
            if (state.search) params.set('search', state.search);
            if (state.role) params.set('role', state.role);
            const data = await api(`/api/admin/users?${params}`);
            state.total = data.total;

            const wrap = $('adm-table-wrap');
            $('adm-empty').style.display = data.users.length ? 'none' : 'block';

            wrap.innerHTML = data.users.length ? `
                <table class="adm-table"><thead><tr>
                    <th>${t('id')}</th><th>${t('username')}</th><th>${t('role')}</th><th>${t('created')}</th>
                    <th>${t('hubs')}</th><th>${t('friends')}</th><th>${t('messages')}</th><th>${t('reports')}</th>
                </tr></thead><tbody>
                ${data.users.map((u) => `
                    <tr data-id="${u.id}">
                        <td data-label="${t('id')}">${u.id}</td>
                        <td data-label="${t('username')}"><b>${esc(u.username)}</b>${u.account_status === 'suspended' ? ` <span class="adm-role founder">${esc(t('suspendedBadge'))}</span>` : ''}</td>
                        <td data-label="${t('role')}"><span class="adm-role ${esc(u.platform_role)}">${esc(u.platform_role)}</span></td>
                        <td data-label="${t('created')}">${fmtDate(u.created_at)}</td>
                        <td data-label="${t('hubs')}">${u.hub_count}</td>
                        <td data-label="${t('friends')}">${u.friend_count}</td>
                        <td data-label="${t('messages')}">${u.message_count}</td>
                        <td data-label="${t('reports')}">${u.reports_against}</td>
                    </tr>`).join('')}
                </tbody></table>` : '';

            wrap.querySelectorAll('tbody tr').forEach((tr) => tr.addEventListener('click', () => openDetail(tr.dataset.id)));

            const pages = Math.max(1, Math.ceil(state.total / state.limit));
            $('adm-page-info').textContent = `${state.total} ${t('users')} · ${t('page')} ${state.page} ${t('of')} ${pages}`;
            $('adm-prev').disabled = state.page <= 1;
            $('adm-next').disabled = state.page >= pages;
        }

        async function openDetail(id) {
            $('adm-overlay').classList.add('open');
            $('adm-detail').innerHTML = `<div class="adm-state">${esc(t('loading'))}</div>`;
            try {
                const d = await api(`/api/admin/users/${encodeURIComponent(id)}`);
                const a = d.account, p = d.profile, ac = d.activity, m = d.moderation;
                const img = safeImg(p.avatar_data);
                const row = (label, value, muted) => `<div class="adm-row"><span>${esc(label)}</span><span class="${muted ? 'adm-muted' : ''}">${value}</span></div>`;
                $('adm-detail').innerHTML = `
                    <div class="adm-user-head">
                        <div class="adm-avatar">${img ? `<img src="${img}" alt="">` : esc((a.username || '?').charAt(0).toUpperCase())}</div>
                        <div><div style="font-size:16px;font-weight:bold;color:#fff;">${esc(a.username)}</div>
                        <span class="adm-role ${esc(a.platform_role)}">${esc(a.platform_role)}</span></div>
                    </div>
                    ${a.role_acceptance_pending ? `<p class="adm-muted" style="font-size:12px;margin:6px 0 0;">${esc(t('rolePending'))}</p>` : ''}
                    <div class="adm-section-title">${t('account')}</div>
                    ${row('ID', a.id)}
                    ${row(t('email'), a.email ? esc(a.email) : esc(t('noEmail')), !a.email)}
                    ${row(t('created'), fmtDate(a.created_at))}
                    ${row(t('accStatus'), statusBadge(a))}
                    ${roleControlsHtml(a)}
                    ${suspendControlsHtml(a)}
                    <div class="adm-section-title">${t('profile')}</div>
                    ${row(t('avatarVisibility'), esc(p.avatar_visibility || '—'))}
                    <div class="adm-row" style="display:block;"><span>${t('about')}</span>
                        <div class="${p.about_me ? 'adm-about' : 'adm-muted'}" style="margin-top:4px;">${p.about_me ? esc(p.about_me) : esc(t('noAbout'))}</div></div>
                    <div class="adm-section-title">${t('activity')}</div>
                    ${row(t('lastActivity'), esc(t('notTracked')), true)}
                    ${row(t('hubMessages'), ac.hub_message_count)}
                    ${row(t('dmSent'), ac.dm_sent_count)}
                    ${row(t('hubsOwned'), ac.hubs_owned)}
                    ${row(t('hubsMember'), ac.hubs_member)}
                    ${row(t('friends'), ac.friend_count)}
                    <div class="adm-section-title">${t('moderationSec')}</div>
                    ${row(t('reportsAgainst'), m.reports_against)}
                    ${row(t('reportsOpen'), m.reports_open)}
                    ${row(t('reportsResolved'), m.reports_resolved)}
                    ${row(t('reportsFiled'), m.reports_filed)}
                    <a class="adm-mod-link" href="moderation.html">${esc(t('viewReports'))}</a>
                    <p class="adm-muted" style="font-size:11px;margin-top:18px;">${esc(t('readOnly'))}</p>`;
                wireRoleControls(a);
                wireSuspendControls(a);
            } catch (e) {
                $('adm-detail').innerHTML = `<div class="adm-state">${esc(e.denied ? t('denied') : t('error'))}</div>`;
            }
        }

        const AUDIT_ACTIONS = ['platform_role_changed', 'platform_role_accepted', 'account_suspended', 'account_unsuspended'];
        const audit = { page: 1, limit: 20, total: 0, loaded: false };

        function who(id, username) {
            if (id == null) return '—';
            return username ? `${esc(username)} <span class="adm-muted">#${id}</span>` : `<span class="adm-muted">${esc(t('auDeleted'))} #${id}</span>`;
        }

        async function loadAudit() {
            const params = new URLSearchParams({ page: audit.page, limit: audit.limit });
            const action = $('au-action').value;
            const actor = $('au-actor').value.trim();
            const target = $('au-target').value.trim();
            const from = $('au-from').value;
            const to = $('au-to').value;
            if (action) params.set('action', action);
            if (actor) params.set('actor_user_id', actor);
            if (target) params.set('target_user_id', target);
            if (from) params.set('from', from);
            if (to) params.set('to', to);

            const data = await api(`/api/admin/audit-log?${params}`);
            audit.total = data.total;

            $('au-empty').style.display = data.entries.length ? 'none' : 'block';
            $('au-table-wrap').innerHTML = data.entries.length ? `
                <table class="adm-table"><thead><tr>
                    <th>${t('auDate')}</th><th>${t('auActor')}</th><th>${t('auAction')}</th>
                    <th>${t('auTarget')}</th><th>${t('auReason')}</th><th>${t('auChange')}</th>
                </tr></thead><tbody style="cursor:default;">
                ${data.entries.map((e) => `
                    <tr style="cursor:default;">
                        <td data-label="${t('auDate')}">${fmtDate(e.created_at)}</td>
                        <td data-label="${t('auActor')}">${who(e.actor_user_id, e.actor_username)}</td>
                        <td data-label="${t('auAction')}">${esc(I18N[lang]['act_' + e.action] || e.action)}</td>
                        <td data-label="${t('auTarget')}">${who(e.target_user_id, e.target_username)}</td>
                        <td data-label="${t('auReason')}">${e.reason ? esc(e.reason) : '<span class="adm-muted">—</span>'}</td>
                        <td data-label="${t('auChange')}">${e.old_value || e.new_value ? `${esc(e.old_value ?? '—')} → ${esc(e.new_value ?? '—')}` : '<span class="adm-muted">—</span>'}</td>
                    </tr>`).join('')}
                </tbody></table>` : '';

            const pages = Math.max(1, Math.ceil(audit.total / audit.limit));
            $('au-page-info').textContent = `${audit.total} ${t('auEntries')} · ${t('page')} ${audit.page} ${t('of')} ${pages}`;
            $('au-prev').disabled = audit.page <= 1;
            $('au-next').disabled = audit.page >= pages;
        }

        function showView(name) {
            $('adm-users-view').style.display = name === 'users' ? 'block' : 'none';
            $('adm-audit-view').style.display = name === 'audit' ? 'block' : 'none';
            $('tab-users').classList.toggle('active', name === 'users');
            $('tab-audit').classList.toggle('active', name === 'audit');
            if (name === 'audit') loadAudit().then(() => { audit.loaded = true; }).catch(showError);
        }

        let isFounder = false;

        async function detectFounder() {
            try {
                const res = await fetch('/api/me', { credentials: 'include' });
                const data = await res.json();
                if (data.success && data.user.platform_role === 'founder') { isFounder = true; $('tab-audit').style.display = ''; }
            } catch (e) {}
        }

        let searchTimer = null;
        function wire() {
            $('tab-users').addEventListener('click', () => showView('users'));
            $('tab-audit').addEventListener('click', () => showView('audit'));
            ['au-action', 'au-actor', 'au-target', 'au-from', 'au-to'].forEach((id) => {
                $(id).addEventListener(id === 'au-actor' || id === 'au-target' ? 'input' : 'change', () => { audit.page = 1; loadAudit().catch(showError); });
            });
            $('au-prev').addEventListener('click', () => { audit.page--; loadAudit().catch(showError); });
            $('au-next').addEventListener('click', () => { audit.page++; loadAudit().catch(showError); });
            $('adm-search').addEventListener('input', (e) => {
                clearTimeout(searchTimer);
                searchTimer = setTimeout(() => { state.search = e.target.value.trim(); state.page = 1; loadUsers().catch(showError); }, 300);
            });
            $('adm-role-filter').addEventListener('change', (e) => { state.role = e.target.value; state.page = 1; loadUsers().catch(showError); });
            $('adm-prev').addEventListener('click', () => { state.page--; loadUsers().catch(showError); });
            $('adm-next').addEventListener('click', () => { state.page++; loadUsers().catch(showError); });
            $('adm-close').addEventListener('click', () => $('adm-overlay').classList.remove('open'));
            $('adm-overlay').addEventListener('click', (e) => { if (e.target === $('adm-overlay')) $('adm-overlay').classList.remove('open'); });
        }

        function showError(e) {
            $('adm-content').style.display = 'none';
            $('adm-loading').style.display = 'none';
            $('adm-denied').textContent = e.denied ? t('denied') : t('error');
            $('adm-denied').style.display = 'block';
        }

        (async function init() {
            applyStaticText();
            try {
                await loadStats();
                wire();
                detectFounder();
                await loadUsers();
                $('adm-loading').style.display = 'none';
                $('adm-content').style.display = 'block';
            } catch (e) {
                showError(e);
            }
        })();
    </script>
</body>
</html>
