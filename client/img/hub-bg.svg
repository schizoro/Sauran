<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <pattern id="hatch" width="14" height="14" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="14" height="14" fill="none"/>
      <line x1="0" y1="0" x2="0" y2="14" stroke="#ffffff" stroke-opacity="0.035" stroke-width="4"/>
    </pattern>
    <radialGradient id="vignette" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#12161d" stop-opacity="1"/>
      <stop offset="100%" stop-color="#090b0f" stop-opacity="1"/>
    </radialGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#vignette)"/>
  <rect width="1024" height="1024" fill="url(#hatch)"/>

  <!-- sol üst köşe aksanı -->
  <g stroke="#66fcf1" fill="none">
    <line x1="4" y1="180" x2="120" y2="256" stroke-width="2" stroke-opacity="0.55"/>
    <path d="M0 178 L18 178 L18 160" stroke-width="1.5" stroke-opacity="0.25"/>
  </g>
  <circle cx="45" cy="212" r="2" fill="#66fcf1" fill-opacity="0.5"/>
  <circle cx="10" cy="230" r="1.6" fill="#66fcf1" fill-opacity="0.4"/>

  <!-- sağ alt köşe aksanı -->
  <g stroke="#66fcf1" fill="none">
    <line x1="1000" y1="700" x2="1024" y2="678" stroke-width="2" stroke-opacity="0.55"/>
    <line x1="905" y1="770" x2="1024" y2="678" stroke-width="2" stroke-opacity="0.55"/>
    <path d="M1024 846 L1006 846 L1006 864" stroke-width="1.5" stroke-opacity="0.25"/>
  </g>
  <circle cx="978" cy="742" r="2" fill="#66fcf1" fill-opacity="0.5"/>
  <circle cx="1010" cy="800" r="1.6" fill="#66fcf1" fill-opacity="0.4"/>

  <!-- dağınık yıldız/nokta dokusu -->
  <circle cx="527" cy="378" r="1.4" fill="#ffffff" fill-opacity="0.6"/>
  <circle cx="490" cy="475" r="1.1" fill="#ffffff" fill-opacity="0.45"/>
  <circle cx="912" cy="410" r="1.2" fill="#ffffff" fill-opacity="0.5"/>
  <circle cx="700" cy="510" r="1.1" fill="#ffffff" fill-opacity="0.4"/>
  <circle cx="556" cy="678" r="1.3" fill="#ffffff" fill-opacity="0.5"/>
  <circle cx="253" cy="880" r="1.1" fill="#ffffff" fill-opacity="0.4"/>
  <circle cx="966" cy="795" r="1.3" fill="#ffffff" fill-opacity="0.5"/>
</svg>
