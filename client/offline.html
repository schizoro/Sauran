<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex">
    <title>Sauran — Bağlantı kurulamadı</title>
    <style>
        :root { color-scheme: dark; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 16px; background: #0a0d11; color: #e8edf2; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
        body::before { content: ""; position: fixed; inset: 0; pointer-events: none; background: radial-gradient(900px 520px at 78% -8%, rgba(60, 150, 210, 0.16), transparent 65%); }
        .card { position: relative; width: min(440px, 100%); padding: 34px 28px; text-align: center; border-radius: 28px; background: rgba(24, 31, 40, 0.62); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.07), 0 0 0 1px rgba(255, 255, 255, 0.12), 0 24px 60px -16px rgba(0, 0, 0, 0.7); -webkit-backdrop-filter: blur(24px); backdrop-filter: blur(24px); }
        .logo { width: 56px; height: 56px; border-radius: 14px; margin: 0 auto 18px; display: block; }
        h1 { margin: 0 0 10px; font-size: 20px; font-weight: 650; }
        p { margin: 0 0 8px; font-size: 14.5px; line-height: 1.55; color: #a4afbb; }
        .count { margin: 18px 0 20px; font-size: 13.5px; color: #7a8693; }
        .count b { color: #5cc8ff; font-variant-numeric: tabular-nums; }
        button { min-height: 46px; padding: 0 26px; border: 0; border-radius: 999px; background: #5cc8ff; color: #04202e; font-size: 14px; font-weight: 650; cursor: pointer; }
        button:active { transform: scale(0.98); }
    </style>
</head>
<body>
    <main class="card">
        <svg xmlns="http://www.w3.org/2000/svg" width="56" height="56" class="logo" role="img" aria-label="Sauran" viewBox="0 0 200 200"><defs><linearGradient id="a" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity=".1"/></linearGradient><linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".16"/><stop offset=".5" stop-color="#fff" stop-opacity=".05"/><stop offset="1" stop-color="#fff" stop-opacity=".85"/></linearGradient></defs><rect width="200" height="200" rx="46" fill="#000"/><circle cx="100" cy="100" r="82" fill="#000"/><circle cx="100" cy="100" r="81.2" fill="none" stroke="url(#a)" stroke-width="1.3"/><circle cx="100" cy="100" r="82.4" fill="none" stroke="url(#b)" stroke-width="1.5"/><path fill="#f2f2f2" d="M76.39 126.17L76.39 110.30Q80.70 113.92 85.76 115.73Q90.82 117.54 95.98 117.54Q99.01 117.54 101.27 116.99Q103.52 116.45 105.04 115.48Q106.55 114.51 107.29 113.20Q108.04 111.88 108.04 110.35Q108.04 108.26 106.85 106.63Q105.66 104.99 103.60 103.60Q101.54 102.21 98.71 100.92Q95.88 99.63 92.61 98.29Q84.27 94.82 80.18 89.81Q76.09 84.80 76.09 77.70Q76.09 72.15 78.32 68.15Q80.55 64.16 84.40 61.58Q88.24 59.00 93.30 57.78Q98.36 56.57 104.02 56.57Q109.57 56.57 113.87 57.24Q118.16 57.91 121.78 59.30L121.78 74.13Q119.99 72.89 117.88 71.95Q115.78 71.01 113.54 70.39Q111.31 69.77 109.10 69.47Q106.90 69.17 104.91 69.17Q102.18 69.17 99.95 69.69Q97.72 70.21 96.18 71.15Q94.64 72.10 93.80 73.41Q92.96 74.73 92.96 76.36Q92.96 78.15 93.90 79.56Q94.84 80.98 96.58 82.24Q98.31 83.51 100.79 84.72Q103.27 85.94 106.40 87.23Q110.67 89.01 114.06 91.02Q117.46 93.03 119.89 95.56Q122.32 98.09 123.61 101.34Q124.90 104.59 124.90 108.91Q124.90 114.86 122.65 118.90Q120.39 122.95 116.52 125.45Q112.65 127.96 107.52 129.05Q102.38 130.14 96.68 130.14Q90.82 130.14 85.54 129.15Q80.26 128.16 76.39 126.17Z"/></svg>
        <h1 id="title">Sauran şu an ulaşılamıyor</h1>
        <p id="text">Sunucu güncelleniyor ya da kısa süreli olarak yanıt vermiyor. Bu genellikle birkaç saniye sürer.</p>
        <p class="count">Otomatik olarak <b id="sec">30</b> saniye sonra yeniden denenecek.</p>
        <button id="retry" type="button">Şimdi dene</button>
    </main>
    <script>
        (function () {
            var remaining = 30;
            var secEl = document.getElementById('sec');
            if (navigator.onLine === false) {
                document.getElementById('title').textContent = 'İnternet bağlantısı yok';
                document.getElementById('text').textContent = 'Cihazının internete bağlı olduğundan emin ol. Bağlantı gelince sayfa yeniden denenecek.';
            }
            function retry() { location.reload(); }
            document.getElementById('retry').addEventListener('click', retry);
            window.addEventListener('online', retry);
            setInterval(function () {
                remaining -= 1;
                if (remaining <= 0) { retry(); return; }
                secEl.textContent = String(remaining);
            }, 1000);
        })();
    </script>
</body>
</html>
