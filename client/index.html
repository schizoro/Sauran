<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sauran</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Giriş Ekranı -->
    <div id="login-screen">
        <div class="login-box">
            <h2>Sauran'a Hoş Geldin</h2>
            <input type="text" id="username-input" placeholder="Kullanıcı Adın" autocomplete="off" autofocus>
            <button id="join-btn">Katıl</button>
        </div>
    </div>

    <!-- Ana Sohbet Ekranı -->
    <div id="chat-screen" style="display: none;">
        <div class="sidebar">
            <h3>Sauran</h3>
            <div class="channel active"># general</div>

            <!-- v1.3: Çevrimiçi Kullanıcı Butonu -->
            <div class="online-section">
                <button id="online-btn">
                    <span class="online-dot"></span>
                    <span id="online-count">0</span> Çevrimiçi
                </button>
            </div>
        </div>

        <div class="chat-area">
            <div id="messages"></div>
            <form id="chat-form">
                <input type="text" id="message-input" autocomplete="off" placeholder="#general kanalına mesaj gönder...">
                <button type="submit">Gönder</button>
            </form>
        </div>
    </div>

    <!-- v1.3: Kullanıcı Listesi Modal -->
    <div id="users-modal" class="modal-overlay" style="display:none;">
        <div class="modal-box">
            <div class="modal-header">
                <span>Çevrimiçi Kullanıcılar</span>
                <button id="close-modal-btn">✕</button>
            </div>
            <ul id="users-list"></ul>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>
</html>
