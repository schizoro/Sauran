# Sunucu testleri: main'e her push'ta ve her PR'da çalışır. Testler geçici veritabanı kullanır; gerçek veriye,
# e-postaya ya da dış servislere dokunmaz. Yerelde: cd server && npm test
name: Server tests

on:
  push:
    branches: [main]
    paths: ['server/**', '.github/workflows/server-tests.yml']
  pull_request:
    paths: ['server/**', '.github/workflows/server-tests.yml']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci

      - run: npm test
